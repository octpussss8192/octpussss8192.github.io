<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>高専4年 中間試験 暗記カード</title>
  <!-- KaTeX（数式レンダリング用） -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --bg-card: #1e293b;
      --bg-card-back: #17253b;
      --bg-sub: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --primary: #38bdf8;
      --primary-hover: #0ea5e9;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
      --red-sheet: #dc2626;
      --shadow: 0 12px 30px -8px rgba(0, 0, 0, 0.5);
    }

    body.light {
      --bg: #f1f5f9;
      --bg-card: #ffffff;
      --bg-card-back: #f8fafc;
      --bg-sub: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #cbd5e1;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --shadow: 0 12px 30px -8px rgba(15, 23, 42, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      transition: background 0.2s, color 0.2s;
      overflow-x: hidden;
    }

    .app-shell {
      max-width: 760px;
      margin: 0 auto;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 10px 12px 16px;
    }

    /* ヘッダー */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .brand h1 {
      font-size: 1.05rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 600;
      transition: transform 0.1s ease, background 0.15s ease, opacity 0.15s ease;
    }

    button:active {
      transform: scale(0.97);
    }

    .icon-btn {
      background: var(--bg-card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 10px;
      font-size: 0.82rem;
    }

    /* 教科タブ（横スクロール対応） */
    .subject-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      margin-bottom: 8px;
      scrollbar-width: none;
    }
    .subject-tabs::-webkit-scrollbar { display: none; }

    .subject-tab {
      flex-shrink: 0;
      padding: 6px 12px;
      background: var(--bg-card);
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 0.82rem;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .subject-tab.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .subject-tab.disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .badge {
      font-size: 0.7rem;
      padding: 1px 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.18);
    }

    /* スリム進捗バー */
    .progress-wrap {
      margin-bottom: 10px;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    .progress-meta strong { color: var(--text); }

    .progress-track {
      width: 100%;
      height: 6px;
      background: var(--bg-sub);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--success));
      width: 0%;
      transition: width 0.3s ease;
    }

    /* コントロールバー */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .mode-switch {
      display: inline-flex;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 2px;
    }

    .mode-btn {
      padding: 5px 10px;
      background: transparent;
      color: var(--text-muted);
      border-radius: 8px;
      font-size: 0.8rem;
    }

    .mode-btn.active {
      background: var(--primary);
      color: #ffffff;
    }

    .filter-group {
      display: flex;
      gap: 6px;
      align-items: center;
      flex: 1;
      justify-content: flex-end;
      min-width: 0;
    }

    select {
      font-family: inherit;
      background: var(--bg-card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 5px 8px;
      font-size: 0.8rem;
      max-width: 175px;
      text-overflow: ellipsis;
    }

    .toggle-pill {
      padding: 5px 9px;
      background: var(--bg-card);
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.78rem;
      white-space: nowrap;
    }

    .toggle-pill.active {
      background: rgba(245, 158, 11, 0.2);
      color: var(--warning);
      border-color: var(--warning);
    }

    /* =====================================================================
       有名フラッシュカード風（タップで裏返す）エリア
       ===================================================================== */
    #cardModeView {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
    }

    .flashcard-scene {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      perspective: 1200px;
      min-height: 320px;
    }

    .flashcard {
      flex: 1;
      position: relative;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 18px 18px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
      transition: transform 0.22s ease, background 0.2s ease, border-color 0.2s ease;
      touch-action: pan-y;
    }

    .flashcard.is-back {
      background: var(--bg-card-back);
      border-color: var(--primary);
    }

    .flashcard.flip-anim {
      animation: cardFlipPop 0.24s ease;
    }

    @keyframes cardFlipPop {
      0% { transform: scale(0.98) rotateX(8deg); opacity: 0.85; }
      100% { transform: scale(1) rotateX(0deg); opacity: 1; }
    }

    /* スワイプ時のインジケーター */
    .swipe-badge {
      position: absolute;
      top: 18px;
      padding: 6px 14px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 0.95rem;
      opacity: 0;
      pointer-events: none;
      z-index: 10;
      border: 2px solid;
    }
    .swipe-badge.mastered {
      left: 18px;
      color: var(--success);
      border-color: var(--success);
      background: rgba(34, 197, 94, 0.15);
    }
    .swipe-badge.review {
      right: 18px;
      color: var(--warning);
      border-color: var(--warning);
      background: rgba(245, 158, 11, 0.15);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      font-size: 0.78rem;
    }

    .cat-tag {
      background: rgba(56, 189, 248, 0.16);
      color: var(--primary);
      padding: 3px 9px;
      border-radius: 999px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 60%;
    }

    .card-right-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      display: inline-block;
    }
    .dot-mastered { background: var(--success); }
    .dot-review { background: var(--warning); }
    .dot-unseen { background: var(--text-muted); opacity: 0.5; }

    .card-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 8px 2px;
      overflow-y: auto;
    }

    .side-label {
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 8px;
      color: var(--text-muted);
    }
    .flashcard.is-back .side-label {
      color: var(--primary);
    }

    .card-text {
      font-size: 1.08rem;
      font-weight: 600;
      line-height: 1.7;
      word-break: break-word;
    }

    .flashcard.is-back .card-text {
      font-size: 1.02rem;
    }

    .card-note {
      margin-top: 14px;
      padding: 10px 12px;
      border-radius: 10px;
      background: var(--bg-sub);
      font-size: 0.86rem;
      color: var(--text-muted);
      line-height: 1.55;
    }

    .tap-hint {
      text-align: center;
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 14px;
      padding-top: 10px;
      border-top: 1px dashed var(--border);
    }

    /* 数式のスマホはみ出し防止 */
    .katex-display {
      overflow-x: auto;
      overflow-y: hidden;
      max-width: 100%;
      padding: 6px 0;
      margin: 8px 0 !important;
    }
    .katex {
      font-size: 1.02em;
    }

    /* 下部アクションバー（親指操作最適化） */
    .bottom-dock {
      display: grid;
      grid-template-columns: 1fr auto auto 1fr;
      gap: 8px;
      align-items: center;
      padding-top: 4px;
    }

    .dock-btn-review {
      background: rgba(245, 158, 11, 0.16);
      color: var(--warning);
      border: 1px solid rgba(245, 158, 11, 0.45);
      padding: 14px 10px;
      font-size: 0.95rem;
      border-radius: 14px;
    }
    .dock-btn-review:hover { background: rgba(245, 158, 11, 0.28); }

    .dock-btn-mastered {
      background: rgba(34, 197, 94, 0.18);
      color: var(--success);
      border: 1px solid rgba(34, 197, 94, 0.45);
      padding: 14px 10px;
      font-size: 0.95rem;
      border-radius: 14px;
    }
    .dock-btn-mastered:hover { background: rgba(34, 197, 94, 0.3); }

    .dock-nav {
      background: var(--bg-card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 14px 14px;
      border-radius: 14px;
      font-size: 0.95rem;
    }

    .shortcut-hint {
      text-align: center;
      font-size: 0.72rem;
      color: var(--text-muted);
      display: none;
    }
    @media (min-width: 640px) {
      .shortcut-hint { display: block; }
      .flashcard { padding: 26px 28px; }
      .card-text { font-size: 1.15rem; }
    }

    /* =====================================================================
       赤シート一覧モード
       ===================================================================== */
    .list-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      gap: 8px;
    }

    .red-sheet-btn {
      background: var(--red-sheet);
      color: #ffffff;
      padding: 7px 13px;
      font-size: 0.82rem;
    }

    .red-sheet-btn.off {
      background: var(--bg-card);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .list-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-bottom: 24px;
    }

    .list-item {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
    }

    .list-item-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 0.76rem;
    }

    .list-q {
      font-weight: 600;
      font-size: 0.96rem;
      margin-bottom: 10px;
    }

    .list-a {
      padding: 10px 12px;
      border-radius: 10px;
      background: var(--bg-sub);
      cursor: pointer;
      position: relative;
      font-size: 0.92rem;
    }

    .list-a.masked {
      background: var(--red-sheet);
      min-height: 44px;
    }

    .list-a.masked .mask-target {
      visibility: hidden;
    }

    .list-a.masked::after {
      content: "タップで解答を表示";
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.82rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.04em;
    }

    .list-item-foot {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 8px;
    }

    .mini-btn {
      padding: 5px 11px;
      font-size: 0.78rem;
      border-radius: 8px;
      background: var(--bg-sub);
      color: var(--text);
    }
    .mini-btn.active-mastered { background: var(--success); color: #fff; }
    .mini-btn.active-review { background: var(--warning); color: #fff; }

    .empty-state {
      text-align: center;
      padding: 48px 20px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      color: var(--text-muted);
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="app-shell">
    <header>
      <div class="brand">
        <span style="font-size: 1.25rem;">🧠</span>
        <h1>中間試験 暗記カード</h1>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="themeToggle">☀️</button>
        <button class="icon-btn" id="resetProgressBtn">🔄 リセット</button>
      </div>
    </header>

    <!-- 教科タブ -->
    <div class="subject-tabs" id="subjectTabs"></div>

    <!-- 進捗バー -->
    <div class="progress-wrap">
      <div class="progress-meta">
        <span>習得: <strong id="progressText">0 / 0 (0%)</strong></span>
        <span id="reviewCountText">要復習: 0問</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>

    <!-- コントロール -->
    <div class="controls">
      <div class="mode-switch">
        <button class="mode-btn active" data-mode="card">🃏 カード</button>
        <button class="mode-btn" data-mode="list">📕 赤シート</button>
      </div>

      <div class="filter-group">
        <select id="categoryFilter"></select>
        <button class="toggle-pill" id="reviewOnlyBtn">🔁 未習得</button>
        <button class="toggle-pill" id="shuffleBtn">🔀</button>
      </div>
    </div>

    <!-- カードモード（タップで裏返す） -->
    <div id="cardModeView">
      <div class="flashcard-scene">
        <div class="flashcard" id="flashcard">
          <div class="swipe-badge mastered" id="badgeMastered">覚えた！</div>
          <div class="swipe-badge review" id="badgeReview">もう一回</div>

          <div class="card-top">
            <span class="cat-tag" id="cardCategory">-</span>
            <div class="card-right-meta">
              <span class="status-dot" id="cardStatusDot"></span>
              <span id="cardCounter">0 / 0</span>
            </div>
          </div>

          <div class="card-body">
            <div class="side-label" id="cardSideLabel">QUESTION</div>
            <div class="card-text" id="cardMainText"></div>
            <div class="card-note hidden" id="cardNote"></div>
          </div>

          <div class="tap-hint" id="tapHint">👆 タップで解答を表示</div>
        </div>
      </div>

      <div class="bottom-dock">
        <button class="dock-btn-review" id="markReviewBtn">🔁 もう一回</button>
        <button class="dock-nav" id="prevCardBtn">◀</button>
        <button class="dock-nav" id="nextCardBtn">▶</button>
        <button class="dock-btn-mastered" id="markMasteredBtn">✅ 覚えた</button>
      </div>
      <div class="shortcut-hint">操作: カードクリック/Spaceで裏返し ／ 左右スワイプ・[1]覚えた・[2]もう一回 ／ [←][→]移動</div>
    </div>

    <!-- 赤シート一覧モード -->
    <div id="listModeView" class="hidden">
      <div class="list-toolbar">
        <span style="font-size: 0.82rem; color: var(--text-muted);" id="listCountInfo"></span>
        <button class="red-sheet-btn" id="redSheetToggle">📕 赤シート: ON</button>
      </div>
      <div class="list-grid" id="listGrid"></div>
    </div>

    <!-- 空状態 -->
    <div id="emptyState" class="empty-state hidden">
      <p style="font-size: 1.05rem; margin-bottom: 6px;">🎉 該当する問題がありません！</p>
      <p style="font-size: 0.85rem;">「🔁 未習得」フィルタを外すか、リセットして再周回できます。</p>
    </div>
  </div>

  <script>
    // =========================================================================
    // 教科・問題データ定義
    // =========================================================================
    const SUBJECTS = [
      { id: "keisoku", name: "13_計測", ready: true },
      { id: "gazo", name: "06_画像処理", ready: true },
      { id: "denshi", name: "02_電子回路", ready: true },
      { id: "pawaele", name: "01_パワエレ", ready: true }
    ];

    const QUESTIONS = {
      keisoku: [
        {
          id: "k_01",
          category: "第1章：測定法・分類",
          q: "【課題1 / 2025過去問1】\n「偏位法（変位法）」とはどのような測定法か。具体例も2つ挙げよ。",
          a: "測定量を表示器に零からの変位（振れ）で示し、その大きさから測定する方法。\n【具体例】電圧計（メータ）、ダイヤルゲージ、バネばかり、体重計",
          note: "長所：測定が速く簡単で、時間変化する量も連続的に測れる。\n短所：表示器やバネなどの特性・精度に依存し、高精度化が難しい。"
        },
        {
          id: "k_02",
          category: "第1章：測定法・分類",
          q: "【課題1 / 2025過去問3】\n「零位法」とはどのような測定法か。具体例も2つ挙げよ。",
          a: "測定する量と基準量との差が零になるように調節し、その基準量の値をもとに測定量を求める方法。\n【具体例】ホイートストンブリッジ、天秤、電位差計",
          note: "長所：測定器から電流を取らない等の理由により、極めて高精度に測定できる。\n短所：平衡調整に時間がかかり、変化する量の測定が難しい。"
        },
        {
          id: "k_03",
          category: "第1章：測定法・分類",
          q: "【課題1】\n「置換法」とはどのような測定法か。",
          a: "測定量と既知の基準量とを同じ振れ（指示値）になるように置き換えて全量比較する測定法。",
          note: "具体例：水中置換法による固体試験片の密度測定、天秤による精密な質量測定。"
        },
        {
          id: "k_04",
          category: "第1章：測定法・分類",
          q: "【課題1】\n「補償法」とはどのような測定法か。",
          a: "偏位法と零位法を組み合わせた方法で、測定する量からそれにほぼ等しい既知の基準量を差し引き、小さくなった差分量を測定する方法。",
          note: "特徴：比較的高い精度が得られ、ダイナミックレンジ（測定範囲）が広く取れる。"
        },
        {
          id: "k_05",
          category: "第1章：測定法・分類",
          q: "「直接測定」と「間接測定」の違いと具体例を答えよ。",
          a: "・直接測定：同じ種類の基準量と直接比較する方法（例：電圧計での電圧測定）\n・間接測定：関係のある別の量を測定し、計算等で間接的に求める方法（例：電圧と電流から抵抗を求める）",
          note: "計測＝基準量の何倍かを数値で表すこと。測定＝検出→数量化→表示・記録→利用の一連の方法。"
        },
        {
          id: "k_06",

          unit: "バリキャップ",
          q: "バリキャップ（可変容量ダイオード）が電圧によって静電容量を変化させられる原理を説明せよ。",

    // =========================================================================
    // 状態管理
    // =========================================================================
    const STORAGE_KEY = "kosen4_midterm_anki_v1";
    let state = {
      subject: "keisoku",
      mode: "card",
      category: "ALL",
      reviewOnly: false,
      shuffled: false,
      redSheetOn: true,
      currentIndex: 0,
      isBack: false,
      progress: {}
    };

    let currentList = [];

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (saved && saved.progress) state.progress = saved.progress;
        if (saved && saved.theme === "light") document.body.classList.add("light");
      } catch (e) {}
      updateThemeBtn();
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        progress: state.progress,
        theme: document.body.classList.contains("light") ? "light" : "dark"
      }));
    }

    // =========================================================================
    // テキスト整形・安全なKaTeXレンダリング
    // =========================================================================
    function formatTextToHtml(str) {
      // HTML特殊文字をエスケープしてから改行を<br>に変換（$...$ の中の < > も壊れないようにする）
      const escaped = str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
      return escaped.replace(/\n/g, "<br>");
    }

    function safeRenderMath(el) {
      if (!el) return;
      if (typeof window.renderMathInElement === "function") {
        window.renderMathInElement(el, {
          delimiters: [
            { left: "$$", right: "$$", display: true },
            { left: "$", right: "$", display: false }
          ],
          throwOnError: false,
          strict: false
        });
      }
    }

    // =========================================================================
    // リスト構築
    // =========================================================================
    function getSubjectQuestions() {
      return QUESTIONS[state.subject] || [];
    }

    function rebuildList(doShuffle = false) {
      let list = getSubjectQuestions().filter(q => {
        if (state.category !== "ALL" && q.category !== state.category) return false;
        if (state.reviewOnly && state.progress[q.id] === "mastered") return false;
        return true;
      });
      if (doShuffle || state.shuffled) {
        for (let i = list.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [list[i], list[j]] = [list[j], list[i]];
        }
      }
      currentList = list;
      if (state.currentIndex >= currentList.length) {
        state.currentIndex = Math.max(0, currentList.length - 1);
      }
      state.isBack = false;
    }

    // =========================================================================
    // UI レンダリング
    // =========================================================================
    function renderTabs() {
      const container = document.getElementById("subjectTabs");
      container.innerHTML = "";
      SUBJECTS.forEach(sub => {
        const btn = document.createElement("button");
        btn.className = "subject-tab" + (sub.id === state.subject ? " active" : "") + (!sub.ready ? " disabled" : "");
        const count = (QUESTIONS[sub.id] || []).length;
        btn.innerHTML = `${sub.name} <span class="badge">${sub.ready ? count : "予定"}</span>`;
        btn.onclick = () => {
          if (!sub.ready) return;
          state.subject = sub.id;
          state.category = "ALL";
          state.currentIndex = 0;
          populateCategories();
          rebuildList();
          renderAll();
        };
        container.appendChild(btn);
      });
    }

    function populateCategories() {
      const sel = document.getElementById("categoryFilter");
      const cats = Array.from(new Set(getSubjectQuestions().map(q => q.category)));
      sel.innerHTML = `<option value="ALL">全単元 (${getSubjectQuestions().length})</option>`;
      cats.forEach(c => {
        const cnt = getSubjectQuestions().filter(q => q.category === c).length;
        const opt = document.createElement("option");
        opt.value = c;
        opt.textContent = `${c} (${cnt})`;
        sel.appendChild(opt);
      });
      sel.value = state.category;
    }

    function renderProgress() {
      const all = getSubjectQuestions();
      const mastered = all.filter(q => state.progress[q.id] === "mastered").length;
      const review = all.filter(q => state.progress[q.id] === "review").length;
      const pct = all.length ? Math.round((mastered / all.length) * 100) : 0;

      document.getElementById("progressText").textContent = `${mastered} / ${all.length} (${pct}%)`;
      document.getElementById("reviewCountText").textContent = `要復習: ${review}問`;
      document.getElementById("progressFill").style.width = `${pct}%`;
    }

    function renderCardMode(animateFlip = false) {
      const cardView = document.getElementById("cardModeView");
      const empty = document.getElementById("emptyState");

      if (currentList.length === 0) {
        cardView.classList.add("hidden");
        empty.classList.remove("hidden");
        return;
      }
      cardView.classList.remove("hidden");
      empty.classList.add("hidden");

      const q = currentList[state.currentIndex];
      const st = state.progress[q.id] || "unseen";
      const card = document.getElementById("flashcard");

      card.classList.toggle("is-back", state.isBack);
      if (animateFlip) {
        card.classList.remove("flip-anim");
        void card.offsetWidth;
        card.classList.add("flip-anim");
      }

      document.getElementById("cardCategory").textContent = q.category;
      document.getElementById("cardCounter").textContent = `${state.currentIndex + 1} / ${currentList.length}`;

      const dot = document.getElementById("cardStatusDot");
      dot.className = "status-dot dot-" + st;

      const labelEl = document.getElementById("cardSideLabel");
      const mainEl = document.getElementById("cardMainText");
      const noteEl = document.getElementById("cardNote");
      const hintEl = document.getElementById("tapHint");

      if (!state.isBack) {
        labelEl.textContent = "QUESTION（問題）";
        mainEl.innerHTML = formatTextToHtml(q.q);
        noteEl.classList.add("hidden");
        hintEl.textContent = "👆 カードをタップして解答を見る";
      } else {
        labelEl.textContent = "ANSWER（解答）";
        mainEl.innerHTML = formatTextToHtml(q.a);
        if (q.note) {
          noteEl.innerHTML = "💡 <strong>ポイント:</strong><br>" + formatTextToHtml(q.note);
          noteEl.classList.remove("hidden");
        } else {
          noteEl.classList.add("hidden");
        }
        hintEl.textContent = "👆 タップで問題に戻る";
      }

      safeRenderMath(card);
    }

    function renderListMode() {
      const listView = document.getElementById("listModeView");
      const empty = document.getElementById("emptyState");
      const grid = document.getElementById("listGrid");

      if (currentList.length === 0) {
        listView.classList.add("hidden");
        empty.classList.remove("hidden");
        return;
      }
      listView.classList.remove("hidden");
      empty.classList.add("hidden");

      document.getElementById("listCountInfo").textContent = `${currentList.length}問 表示中`;
      const toggleBtn = document.getElementById("redSheetToggle");
      toggleBtn.textContent = state.redSheetOn ? "📕 赤シート: ON" : "📖 赤シート: OFF";
      toggleBtn.classList.toggle("off", !state.redSheetOn);

      grid.innerHTML = "";
      currentList.forEach((q, idx) => {
        const st = state.progress[q.id] || "unseen";
        const item = document.createElement("div");
        item.className = "list-item";

        const noteHtml = q.note
          ? `<div style="margin-top:8px; padding-top:8px; border-top:1px dashed var(--border); font-size:0.84rem; color:var(--text-muted);">💡 ${formatTextToHtml(q.note)}</div>`
          : "";

        item.innerHTML = `
          <div class="list-item-head">
            <span class="cat-tag">${q.category}</span>
            <span style="color: var(--text-muted);">#${idx + 1}</span>
          </div>
          <div class="list-q">${formatTextToHtml(q.q)}</div>
          <div class="list-a ${state.redSheetOn ? "masked" : ""}">
            <div class="mask-target">
              <div style="font-weight:700;">${formatTextToHtml(q.a)}</div>
              ${noteHtml}
            </div>
          </div>
          <div class="list-item-foot">
            <button class="mini-btn ${st === "review" ? "active-review" : ""}" data-act="review">🔁 もう一回</button>
            <button class="mini-btn ${st === "mastered" ? "active-mastered" : ""}" data-act="mastered">✅ 覚えた</button>
          </div>
        `;

        const ansBox = item.querySelector(".list-a");
        ansBox.onclick = () => ansBox.classList.toggle("masked");

        item.querySelector('[data-act="review"]').onclick = () => {
          state.progress[q.id] = "review";
          saveState();
          renderProgress();
          renderListMode();
        };
        item.querySelector('[data-act="mastered"]').onclick = () => {
          state.progress[q.id] = "mastered";
          saveState();
          if (state.reviewOnly) rebuildList();
          renderProgress();
          renderListMode();
        };

        grid.appendChild(item);
      });

      safeRenderMath(grid);
    }

    function renderAll() {
      renderTabs();
      renderProgress();
      if (state.mode === "card") {
        document.getElementById("cardModeView").classList.remove("hidden");
        document.getElementById("listModeView").classList.add("hidden");
        renderCardMode();
      } else {
        document.getElementById("cardModeView").classList.add("hidden");
        document.getElementById("listModeView").classList.remove("hidden");
        renderListMode();
      }
    }

    function updateThemeBtn() {
      document.getElementById("themeToggle").textContent = document.body.classList.contains("light") ? "🌙" : "☀️";
    }

    // =========================================================================
    // カード操作（タップ反転・スワイプ判定）
    // =========================================================================
    const flashcardEl = document.getElementById("flashcard");
    const badgeMastered = document.getElementById("badgeMastered");
    const badgeReview = document.getElementById("badgeReview");

    let touchStartX = 0;
    let touchStartY = 0;
    let touchDeltaX = 0;
    let isSwiping = false;

    flashcardEl.addEventListener("touchstart", (e) => {
      if (e.touches.length !== 1) return;
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      touchDeltaX = 0;
      isSwiping = false;
      flashcardEl.style.transition = "none";
    }, { passive: true });

    flashcardEl.addEventListener("touchmove", (e) => {
      if (e.touches.length !== 1) return;
      const dx = e.touches[0].clientX - touchStartX;
      const dy = e.touches[0].clientY - touchStartY;
      if (!isSwiping && Math.abs(dx) > 15 && Math.abs(dx) > Math.abs(dy) * 1.2) {
        isSwiping = true;
      }
      if (isSwiping) {
        touchDeltaX = dx;
        const rot = dx * 0.04;
        flashcardEl.style.transform = `translateX(${dx}px) rotate(${rot}deg)`;
        badgeMastered.style.opacity = dx > 30 ? Math.min(1, (dx - 30) / 70) : 0;
        badgeReview.style.opacity = dx < -30 ? Math.min(1, (-dx - 30) / 70) : 0;
      }
    }, { passive: true });

    flashcardEl.addEventListener("touchend", () => {
      flashcardEl.style.transition = "transform 0.2s ease";
      flashcardEl.style.transform = "";
      badgeMastered.style.opacity = 0;
      badgeReview.style.opacity = 0;

      if (isSwiping) {
        if (touchDeltaX > 90) {
          markCurrent("mastered");
        } else if (touchDeltaX < -90) {
          markCurrent("review");
        }
        setTimeout(() => { isSwiping = false; }, 50);
      }
    });

    flashcardEl.addEventListener("click", (e) => {
      if (isSwiping) return;
      // 数式スクロール操作などの誤反応を除き、タップで裏返し
      state.isBack = !state.isBack;
      renderCardMode(true);
    });

    function markCurrent(status) {
      if (currentList.length === 0) return;
      const q = currentList[state.currentIndex];
      state.progress[q.id] = status;
      saveState();
      if (state.reviewOnly && status === "mastered") {
        rebuildList();
      } else {
        state.currentIndex = (state.currentIndex + 1) % currentList.length;
        state.isBack = false;
      }
      renderProgress();
      renderCardMode(true);
    }

    // =========================================================================
    // イベントリスナー
    // =========================================================================
    document.querySelectorAll(".mode-btn").forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll(".mode-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        state.mode = btn.dataset.mode;
        renderAll();
      };
    });

    document.getElementById("categoryFilter").onchange = (e) => {
      state.category = e.target.value;
      state.currentIndex = 0;
      rebuildList();
      renderAll();
    };

    document.getElementById("reviewOnlyBtn").onclick = (e) => {
      state.reviewOnly = !state.reviewOnly;
      e.target.classList.toggle("active", state.reviewOnly);
      state.currentIndex = 0;
      rebuildList();
      renderAll();
    };

    document.getElementById("shuffleBtn").onclick = (e) => {
      state.shuffled = !state.shuffled;
      e.target.classList.toggle("active", state.shuffled);
      state.currentIndex = 0;
      rebuildList(state.shuffled);
      renderAll();
    };

    document.getElementById("prevCardBtn").onclick = () => {
      if (currentList.length === 0) return;
      state.currentIndex = (state.currentIndex - 1 + currentList.length) % currentList.length;
      state.isBack = false;
      renderCardMode(true);
    };

    document.getElementById("nextCardBtn").onclick = () => {
      if (currentList.length === 0) return;
      state.currentIndex = (state.currentIndex + 1) % currentList.length;
      state.isBack = false;
      renderCardMode(true);
    };

    document.getElementById("markMasteredBtn").onclick = () => markCurrent("mastered");
    document.getElementById("markReviewBtn").onclick = () => markCurrent("review");

    document.getElementById("redSheetToggle").onclick = () => {
      state.redSheetOn = !state.redSheetOn;
      renderListMode();
    };

    document.getElementById("themeToggle").onclick = () => {
      document.body.classList.toggle("light");
      updateThemeBtn();
      saveState();
    };

    document.getElementById("resetProgressBtn").onclick = () => {
      if (!confirm("現在の教科の習得状況をすべてリセットしますか？")) return;
      getSubjectQuestions().forEach(q => delete state.progress[q.id]);
      saveState();
      state.currentIndex = 0;
      rebuildList();
      renderAll();
    };

    document.addEventListener("keydown", (e) => {
      if (state.mode !== "card" || currentList.length === 0) return;
      if (e.target.tagName === "SELECT" || e.target.tagName === "INPUT") return;
      if (e.code === "Space") {
        e.preventDefault();
        state.isBack = !state.isBack;
        renderCardMode(true);
      } else if (e.key === "1") {
        markCurrent("mastered");
      } else if (e.key === "2") {
        markCurrent("review");
      } else if (e.key === "ArrowRight") {
        document.getElementById("nextCardBtn").click();
      } else if (e.key === "ArrowLeft") {
        document.getElementById("prevCardBtn").click();
      }
    });

    // 初期化（KaTeXロード完了後にも確実に再描画）
    window.addEventListener("DOMContentLoaded", () => {
      loadState();
      populateCategories();
      rebuildList();
      renderAll();
    });

    window.addEventListener("load", () => {
      renderAll();
    });
  </script>
</body>
</html>
